<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="normalize.css" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <h1>Workout Tracker</h1>
      <p>Log workouts, track progress, and keep your history locally in your browser.</p>
    </header>

    <main class="layout">
      <section class="card">
        <h2>Add Workout</h2>
        <form id="workout-form" class="form-grid">
          <label>
            Date
            <input type="date" id="date" required />
          </label>

          <label>
            Workout Type
            <select id="type" required>
              <option value="">Select type...</option>
              <option value="Strength">Strength</option>
              <option value="Cardio">Cardio</option>
              <option value="Mobility">Mobility</option>
              <option value="Sport">Sport</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Exercise
            <input type="text" id="exercise" placeholder="e.g., Bench Press" required />
          </label>

          <label>
            Sets
            <input type="number" id="sets" min="0" step="1" placeholder="e.g., 4" />
          </label>

          <label>
            Reps
            <input type="number" id="reps" min="0" step="1" placeholder="e.g., 8" />
          </label>

          <label>
            Weight (lb)
            <input type="number" id="weight" min="0" step="1" placeholder="e.g., 135" />
          </label>

          <label>
            Duration (min)
            <input type="number" id="duration" min="0" step="1" placeholder="e.g., 30" />
          </label>

          <label class="full-width">
            Notes
            <textarea id="notes" rows="3" placeholder="How did it feel? Any PRs?"></textarea>
          </label>

          <button type="submit" class="primary">Save Workout</button>
        </form>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2>History</h2>
          <div class="toolbar-controls">
            <label>
              Filter by Type
              <select id="filter-type">
                <option value="all">All</option>
                <option value="Strength">Strength</option>
                <option value="Cardio">Cardio</option>
                <option value="Mobility">Mobility</option>
                <option value="Sport">Sport</option>
                <option value="Other">Other</option>
              </select>
            </label>
            <button id="clear-all" class="danger" type="button">Clear All</button>
          </div>
        </div>

        <div class="stats" id="stats"></div>

        <ul id="workout-list" class="workout-list"></ul>
        <p id="empty-state" class="empty-state">No workouts logged yet.</p>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
